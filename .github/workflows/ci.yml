name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint (typecheck + guardrails)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

# scripts/smoke.ts is deliberately NOT in CI: it signs a real Shannon
# transaction and needs a funded burner key. It is a manual gate
# (`npm run smoke`), never an automated one — CI must not hold a signer.
